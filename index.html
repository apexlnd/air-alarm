<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта тривог України</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: white; padding: 12px 16px; border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.2); font-size: 14px; max-width: 260px;
        }
        .info-panel h3 { margin: 0 0 6px; font-size: 16px; }
        .info-panel .status { font-weight: bold; }
        .info-panel .status.active { color: #d32f2f; }
        .info-panel .status.clear { color: #2e7d32; }
        .legend {
            position: absolute; bottom: 20px; left: 20px; z-index: 1000;
            background: white; padding: 10px 14px; border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15); font-size: 13px; display: flex; gap: 16px;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .legend-color { width: 18px; height: 18px; border-radius: 3px; }
    </style>
</head>
<body>
    <div id="map"></div>

    <div class="info-panel">
        <h3>🛡️ Статус тривог</h3>
        <div>Областей у тривозі: <span id="alert-count" class="status">—</span></div>
        <div style="margin-top:6px; font-size:12px; color:#666;" id="last-updated">Оновлення: —</div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="legend-color" style="background:#d32f2f;"></span> Тривога</div>
        <div class="legend-item"><span class="legend-color" style="background:#2e7d32;"></span> Спокійно</div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Ініціалізація карти
        const map = L.map('map', { zoomControl: true }).setView([49.0, 31.0], 6);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Два джерела для меж областей (основне та резервне)
        const GEOJSON_URL = 'https://cdn.jsdelivr.net/gh/wmgeolab/geoBoundaries@main/releaseData/gbOpen/UKR/ADM1/geoBoundaries-UKR-ADM1_simplified.geojson';
        const GEOJSON_FALLBACK = 'https://raw.githubusercontent.com/org-scn-design-system/region-ua/master/ua_regions.geojson';

        // Дані про тривоги
        const TARGET_API = 'https://ubilling.net.ua/aerialalerts/';
        const PROXIES = [
            (url) => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
            (url) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
            (url) => `https://api.cors.lol/?url=${encodeURIComponent(url)}`
        ];

        let geoLayer = null;

        function normalizeName(name) {
            if (!name) return '';
            return name.toLowerCase()
                .replace(/[’'`]/g, '')
                .replace(/\s*область\s*/g, '')
                .replace(/\s*обл\.?\s*/g, '')
                .replace(/\s*місто\s*/g, '')
                .trim();
        }

        async function fetchWithFallback(targetUrl) {
            let lastError;
            for (let i = 0; i < PROXIES.length; i++) {
                try {
                    const proxyUrl = PROXIES[i](targetUrl);
                    const response = await fetch(proxyUrl);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    return await response.json(); 
                } catch (e) {
                    lastError = e;
                }
            }
            throw new Error('Всі проксі вичерпано: ' + lastError.message);
        }

        async function loadAlerts() {
            try {
                const alertsData = await fetchWithFallback(TARGET_API);

                const activeRegions = new Set();
                if (alertsData && alertsData.states) {
                    for (const [regionName, params] of Object.entries(alertsData.states)) {
                        if (params.alertnow) {
                            activeRegions.add(normalizeName(regionName));
                        }
                    }
                }

                const counterEl = document.getElementById('alert-count');
                counterEl.textContent = activeRegions.size;
                counterEl.className = 'status ' + (activeRegions.size > 0 ? 'active' : 'clear');
                document.getElementById('last-updated').textContent =
                    'Оновлення: ' + new Date().toLocaleTimeString('uk-UA');

                // Якщо межі ще не завантажені - вантажимо їх
                if (!geoLayer) {
                    let geoJson = null;
                    try {
                        const geoRes = await fetch(GEOJSON_URL);
                        if (!geoRes.ok) throw new Error('Main URL failed');
                        geoJson = await geoRes.json();
                    } catch (e) {
                        console.warn('Основне посилання на межі не працює, пробуємо резервне...');
                        const geoResFallback = await fetch(GEOJSON_FALLBACK);
                        geoJson = await geoResFallback.json();
                    }

                    geoLayer = L.geoJSON(geoJson, {
                        style: function(feature) {
                            // У різних файлах назви можуть бути в різних полях
                            const rawName = feature.properties.shapeName || feature.properties.name || feature.properties.NAME_1 || feature.properties.UkrName || '';
                            const isActive = activeRegions.has(normalizeName(rawName));
                            return {
                                color: isActive ? '#b71c1c' : '#2e7d32',
                                weight: 1.5,
                                fillColor: isActive ? '#d32f2f' : '#4caf50',
                                fillOpacity: isActive ? 0.65 : 0.25,
                            };
                        },
                        onEachFeature: function(feature, layer) {
                            const rawName = feature.properties.shapeName || feature.properties.name || feature.properties.NAME_1 || feature.properties.UkrName || '';
                            const isActive = activeRegions.has(normalizeName(rawName));
                            layer.bindTooltip(
                                `<strong>${rawName}</strong><br>${isActive ? '🔴 Тривога' : '🟢 Спокійно'}`,
                                { sticky: true }
                            );
                        }
                    }).addTo(map);
                } else {
                    // Оновлення кольорів, якщо межі вже є
                    geoLayer.eachLayer(function(layer) {
                        const props = layer.feature.properties;
                        const rawName = props.shapeName || props.name || props.NAME_1 || props.UkrName || '';
                        const isActive = activeRegions.has(normalizeName(rawName));
                        layer.setStyle({
                            color: isActive ? '#b71c1c' : '#2e7d32',
                            weight: 1.5,
                            fillColor: isActive ? '#d32f2f' : '#4caf50',
                            fillOpacity: isActive ? 0.65 : 0.25,
                        });
                        layer.setTooltipContent(
                            `<strong>${rawName}</strong><br>${isActive ? '🔴 Тривога' : '🟢 Спокійно'}`
                        );
                    });
                }
            } catch (err) {
                console.error('Помилка:', err);
                document.getElementById('last-updated').textContent = 'Помилка оновлення';
            }
        }

        loadAlerts();
        setInterval(loadAlerts, 30000);
    </script>
</body>
</html>
